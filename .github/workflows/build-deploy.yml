name: Build and deploy catalog

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}
  push:
    # master — в старом репозитории, main — в корневом: у новых репозиториев
    # GitHub делает главной именно main, а Pages пускает только с главной ветки.
    branches: [master, main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run tests
        run: node --test
      - name: Build site
        run: node src/build.js
        env:
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          SITE_BASE_URL: https://lazerklin.ru
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
